<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Sistema Distribuido - Login</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="css/style.css"
        rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="card shadow login-card">

        <div class="card-body">

            <h2 class="text-center mb-3">

                Sistema Distribuido

            </h2>

            <h5 class="text-center text-secondary mb-4">

                Inicio de Sesion

            </h5>

            <div class="mb-3">

                <label class="form-label">

                    Usuario

                </label>

                <input
                    id="txtUser"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Contrasena / API Key

                </label>

                <input
                    id="txtPassword"
                    type="password"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Tipo de Usuario

                </label>

                <select
                    id="cmbRole"
                    class="form-select">

                    <option value="admin">

                        Administrador

                    </option>

                    <option value="client">

                        Cliente

                    </option>

                </select>

            </div>

            <button
                id="btnLogin"
                class="btn btn-primary w-100">

                Iniciar Sesion

            </button>

            <hr>

            <div
                id="serverStatus"
                class="text-center">

                Verificando servidor...

            </div>

        </div>

    </div>

</div>

<!-- Loading -->

<div id="loading"
     class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none">

    <div class="d-flex justify-content-center align-items-center h-100">

        <div class="spinner-border text-light"></div>

    </div>

</div>

<!-- Toast -->

<div class="toast-container position-fixed bottom-0 end-0 p-3">

    <div
        id="mainToast"
        class="toast">

        <div class="toast-header">

            <strong class="me-auto">

                Sistema

            </strong>

            <button
                class="btn-close"
                data-bs-dismiss="toast">
            </button>

        </div>

        <div
            class="toast-body"
            id="toastBody">

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/login.js"></script>

</body>

</html>
