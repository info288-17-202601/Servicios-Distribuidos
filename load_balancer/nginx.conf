events {
    worker_connections 1024;
}

http {
    # Upstream: API Gateway — round-robin por defecto
    # Escalabilidad horizontal: agregar más instancias aquí
    upstream api_gateway_cluster {
        least_conn;                     # algoritmo: menor conexiones activas
        server api_gateway_1:8000;
        server api_gateway_2:8000;
        keepalive 32;
    }

    # Servidor principal — API pública (puerto 80)
    server {
        listen 80;
        server_name _;

        # Headers de información del balanceador
        add_header X-Load-Balancer "NGINX" always;
        add_header X-Upstream      $upstream_addr always;

        # Timeouts
        proxy_connect_timeout   5s;
        proxy_send_timeout      30s;
        proxy_read_timeout      30s;

        # Proxy headers estándar
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Todo el tráfico va al cluster de gateways
        location / {
            proxy_pass http://api_gateway_cluster;
        }

        # Health check del balanceador mismo
        location /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }
    }

    # Servidor de monitoreo (puerto 8080)
    server {
        listen 8080;
        server_name _;

        # Dashboard de stats
        location / {
            proxy_pass http://stats_service:8002;
        }
    }

    # Logging estructurado
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;
}
